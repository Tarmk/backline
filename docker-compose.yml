# One-command deploy: app + Postgres + Caddy (automatic HTTPS).
#   1. Point your domain's DNS at the server.
#   2. Copy .env.example to .env and set DOMAIN and POSTGRES_PASSWORD.
#   3. docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://backline:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/backline
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: backline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: backline
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backline"]
      interval: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
